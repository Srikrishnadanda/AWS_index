<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sri Krishna</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Trebuchet MS', Arial, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    min-height: 100vh;
  }
  .hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
    padding: 20px;
    background: radial-gradient(circle at top, #1e293b, #0f172a);
  }
  .avatar {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    background: linear-gradient(135deg, #38bdf8, #6366f1);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.5rem;
    font-weight: bold;
    color: white;
    margin-bottom: 25px;
    box-shadow: 0 0 40px rgba(56,189,248,0.4);
  }
  h1 {
    font-size: 2.8rem;
    margin-bottom: 10px;
    background: linear-gradient(90deg, #38bdf8, #a78bfa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .tagline {
    font-size: 1.15rem;
    color: #94a3b8;
    margin-bottom: 35px;
    max-width: 500px;
  }
  .links {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .links a {
    padding: 12px 28px;
    border-radius: 30px;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.95rem;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .primary {
    background: #38bdf8;
    color: #0f172a;
  }
  .secondary {
    border: 1.5px solid #475569;
    color: #e2e8f0;
  }
  .links a:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(56,189,248,0.25);
  }
  .badges {
    margin-top: 50px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .badge {
    background: #1e293b;
    border: 1px solid #334155;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 0.85rem;
    color: #cbd5e1;
  }
  footer {
    position: absolute;
    bottom: 20px;
    width: 100%;
    text-align: center;
    color: #64748b;
    font-size: 0.85rem;
  }
</style>
</head>
<body>

<div class="hero">
  <div class="avatar">SK</div>
  <h1>Sri Krishna</h1>
  <p class="tagline">Cloud & AWS learner, currently building and deploying projects with S3, CloudFront, and Amplify.</p>

  <div class="links">
    <a href="mailto:your-email@example.com" class="primary">Say Hello</a>
    <a href="#" class="secondary">View Projects</a>
  </div>

  <div class="badges">
    <span class="badge">☁️ AWS S3</span>
    <span class="badge">⚡ CloudFront</span>
    <span class="badge">🚀 Amplify</span>
    <span class="badge">🎯 Certification Track</span>
  </div>
</div>

<footer>&copy; 2026 Sri Krishna — Hosted on AWS</footer>

</body>
</html>
